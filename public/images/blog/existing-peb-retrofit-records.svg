<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Example retrofit evidence register separating archived drawings, current observations and an unresolved equipment support question." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="630" fill="#f3f6f5"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0e9f8f"/>
  <g font-family="Lato, Arial, sans-serif">
    <text x="60" y="78" font-size="22" font-weight="800" fill="#0b6f65" letter-spacing="3">EXISTING BUILDINGS · EVIDENCE REGISTER</text>
    <text x="60" y="124" font-size="38" font-weight="800" fill="#001524">Records, observations, open questions</text>
    <g>
      <rect x="60" y="170" width="332" height="270" rx="16" fill="#fff" stroke="#dbe5e2" stroke-width="2"/>
      <rect x="60" y="170" width="332" height="8" rx="4" fill="#1d3557"/>
      <text x="88" y="232" font-size="40" font-weight="800" fill="#1d3557">01</text>
      <text x="88" y="276" font-size="25" font-weight="800" fill="#001524">Record information</text>
      <text x="88" y="318" font-size="20" fill="#2c4452">Archived drawing: no</text>
      <text x="88" y="346" font-size="20" fill="#2c4452">suspended services listed</text>
      <text x="88" y="374" font-size="20" fill="#2c4452">in this bay.</text>
    </g>
    <g>
      <rect x="434" y="170" width="332" height="270" rx="16" fill="#fff" stroke="#dbe5e2" stroke-width="2"/>
      <rect x="434" y="170" width="332" height="8" rx="4" fill="#0e9f8f"/>
      <text x="462" y="232" font-size="40" font-weight="800" fill="#0e9f8f">02</text>
      <text x="462" y="276" font-size="25" font-weight="800" fill="#001524">Current observation</text>
      <text x="462" y="318" font-size="20" fill="#2c4452">Dated site note: existing</text>
      <text x="462" y="346" font-size="20" fill="#2c4452">service supports recorded.</text>
    </g>
    <g>
      <rect x="808" y="170" width="332" height="270" rx="16" fill="#fbf0dc" stroke="#d9962b" stroke-width="2" stroke-dasharray="8 6"/>
      <rect x="808" y="170" width="332" height="8" rx="4" fill="#d9962b"/>
      <text x="836" y="232" font-size="40" font-weight="800" fill="#8a5a0c">03</text>
      <text x="836" y="276" font-size="25" font-weight="800" fill="#001524">Unresolved question</text>
      <text x="836" y="318" font-size="20" fill="#2c4452">How do the existing</text>
      <text x="836" y="346" font-size="20" fill="#2c4452">alterations affect review of</text>
      <text x="836" y="374" font-size="20" fill="#2c4452">the new proposal?</text>
    </g>
    <text x="60" y="560" font-size="19" fill="#5a7282">Illustrative evidence register for a hypothetical retrofit. Not a capacity statement or permission to install.</text>
    <text x="1140" y="600" font-size="20" font-weight="800" fill="#001524" text-anchor="end">DIYPREFAB</text>
  </g>
</svg>
