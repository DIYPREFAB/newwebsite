<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Illustrative PEB operating-cycle sheet linking dispatch, cleaning and closed hours to zone activities, door and system routines, moisture evidence and designer questions." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e4ecea" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#0e9f8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#f3f6f5"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0e9f8f"/>
  <g font-family="Lato, Arial, Helvetica, sans-serif">
    <text x="54" y="92" fill="#0b6f65" font-size="22" font-weight="800" letter-spacing="3.5">GUIDE · OPERATING CYCLE</text>
    <text x="54" y="144" fill="#0b1f2c" font-size="46" font-weight="800">Operating cycle evidence sheet</text>

    <g>
      <rect x="54" y="222" width="316" height="190" rx="14" fill="#ffffff" stroke="#dbe5e2" stroke-width="2"/>
      <text x="212" y="266" fill="#0b6f65" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">OPERATING STATE 1</text>
      <text x="212" y="328" fill="#0b1f2c" font-size="34" font-weight="800" text-anchor="middle">Dispatch</text>
      <text x="212" y="376" fill="#5a7282" font-size="22" text-anchor="middle">Loading zone</text>
    </g>
    <path d="M378 317 H440" stroke="#0e9f8f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
    <g>
      <rect x="446" y="222" width="316" height="190" rx="14" fill="#ffffff" stroke="#dbe5e2" stroke-width="2"/>
      <text x="604" y="266" fill="#0b6f65" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">OPERATING STATE 2</text>
      <text x="604" y="312" fill="#0b1f2c" font-size="34" font-weight="800" text-anchor="middle">Post-dispatch</text>
      <text x="604" y="350" fill="#0b1f2c" font-size="34" font-weight="800" text-anchor="middle">cleaning</text>
      <text x="604" y="388" fill="#5a7282" font-size="22" text-anchor="middle">Storage floor</text>
    </g>
    <path d="M770 317 H832" stroke="#0e9f8f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
    <g>
      <rect x="838" y="222" width="308" height="190" rx="14" fill="#e3f4f1" stroke="#0e9f8f" stroke-width="2.5"/>
      <text x="992" y="266" fill="#0b6f65" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">OPERATING STATE 3</text>
      <text x="992" y="328" fill="#0b1f2c" font-size="34" font-weight="800" text-anchor="middle">Closed hours</text>
      <text x="992" y="376" fill="#5a7282" font-size="22" text-anchor="middle">Packing zone</text>
    </g>

    <text x="54" y="474" fill="#2c4452" font-size="22">Each state records activity, door and system routine, moisture-source evidence and a designer question.</text>
    <text x="54" y="570" fill="#5a7282" font-size="18">Illustrative example. Not a DIYPREFAB project, a diagnosis or a design solution.</text>
    <text x="1146" y="570" fill="#0b1f2c" font-size="20" font-weight="800" letter-spacing="1" text-anchor="end">DIYPREFAB</text>
  </g>
</svg>
