<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two labelled time windows for steel output: the month measured, September 2026, and the cumulative period, January to September 2026. Released 23 October 2026. Reported output, not forecast." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e4ecea" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#f3f6f5"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d9962b"/>
  <g font-family="Lato, Arial, Helvetica, sans-serif">
    <text x="54" y="92" fill="#8a5a0c" font-size="22" font-weight="800" letter-spacing="3.5">INDUSTRY BRIEFING · REPORTED OUTPUT</text>
    <text x="54" y="144" fill="#0b1f2c" font-size="46" font-weight="800">Two time windows, read separately</text>

    <g>
      <rect x="54" y="214" width="520" height="206" rx="14" fill="#ffffff" stroke="#dbe5e2" stroke-width="2"/>
      <rect x="54" y="214" width="520" height="8" rx="4" fill="#0e9f8f"/>
      <text x="90" y="274" fill="#0b6f65" font-size="19" font-weight="800" letter-spacing="2.5">MONTH MEASURED</text>
      <text x="90" y="340" fill="#0b1f2c" font-size="54" font-weight="800">Sep 2026</text>
      <text x="90" y="388" fill="#5a7282" font-size="24">versus Sep 2025</text>
    </g>
    <text x="600" y="333" fill="#8a5a0c" font-size="40" font-weight="800" text-anchor="middle">≠</text>
    <g>
      <rect x="626" y="214" width="520" height="206" rx="14" fill="#fdf6e8" stroke="#d9962b" stroke-width="2.5"/>
      <rect x="626" y="214" width="520" height="8" rx="4" fill="#d9962b"/>
      <text x="662" y="274" fill="#8a5a0c" font-size="19" font-weight="800" letter-spacing="2.5">CUMULATIVE</text>
      <text x="662" y="340" fill="#0b1f2c" font-size="54" font-weight="800">Jan–Sep 2026</text>
      <text x="662" y="388" fill="#5a7282" font-size="24">versus Jan–Sep 2025</text>
    </g>

    <text x="54" y="474" fill="#2c4452" font-size="22">Released 23 Oct 2026 · Reported output, not forecast</text>
    <text x="54" y="570" fill="#5a7282" font-size="18">Editorial illustration. Period labels only; not a chart, price or availability signal.</text>
    <text x="1146" y="570" fill="#0b1f2c" font-size="20" font-weight="800" letter-spacing="1" text-anchor="end">DIYPREFAB</text>
  </g>
</svg>
