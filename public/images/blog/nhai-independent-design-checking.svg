<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Editorial diagram showing design submission, independent review, designer response and revised submission." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0e9f8f"/></marker></defs>
  <rect width="1200" height="630" fill="#f3f6f5"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d9962b"/>
  <g font-family="Lato, Arial, sans-serif">
    <text x="60" y="78" font-size="22" font-weight="800" fill="#8a5a0c" letter-spacing="3">INDUSTRY BRIEFING · REVIEW PROCESS</text>
    <text x="60" y="124" font-size="38" font-weight="800" fill="#001524">Scope, observation, response, revision</text>
    <g font-size="25" font-weight="800" fill="#001524" text-anchor="middle">
      <rect x="60" y="230" width="230" height="150" rx="16" fill="#fff" stroke="#dbe5e2" stroke-width="2"/>
      <text x="175" y="298">Design</text><text x="175" y="332">submission</text>
      <rect x="350" y="230" width="230" height="150" rx="16" fill="#fff" stroke="#dbe5e2" stroke-width="2"/>
      <text x="465" y="298">Independent</text><text x="465" y="332">review</text>
      <rect x="640" y="230" width="230" height="150" rx="16" fill="#fff" stroke="#dbe5e2" stroke-width="2"/>
      <text x="755" y="298">Designer</text><text x="755" y="332">response</text>
      <rect x="930" y="230" width="210" height="150" rx="16" fill="#e3f4f1" stroke="#0e9f8f" stroke-width="2"/>
      <text x="1035" y="298">Revised</text><text x="1035" y="332">submission</text>
    </g>
    <g stroke="#0e9f8f" stroke-width="4" fill="none" marker-end="url(#a)">
      <path d="M296 305H342"/><path d="M586 305H632"/><path d="M876 305H922"/>
    </g>
    <text x="60" y="470" font-size="21" fill="#2c4452">Each observation is assigned to a responsible designer; the response is kept with the revised submission.</text>
    <text x="60" y="560" font-size="19" fill="#5a7282">Editorial illustration. Not an NHAI project or official diagram.</text>
    <text x="1140" y="600" font-size="20" font-weight="800" fill="#001524" text-anchor="end">DIYPREFAB</text>
  </g>
</svg>
