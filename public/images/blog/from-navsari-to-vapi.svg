<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Illustration of a dashed route linking two marked points, Navsari and Vapi, over a faint steel portal frame. Not a photograph of the project." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001524"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- faint portal frame -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10" stroke-linejoin="round">
    <path d="M160 540 V300 L600 130 L1040 300 V540"/>
    <path d="M160 300 H1040"/>
    <path d="M160 540 L600 190 L1040 540" stroke-width="5" stroke-dasharray="14 12"/>
  </g>
  <path d="M60 540 H1140" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <!-- route -->
  <path d="M300 420 C 480 300, 700 300, 900 230" fill="none" stroke="#2fd4c0" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="300" cy="420" r="16" fill="#2fd4c0"/>
  <circle cx="300" cy="420" r="30" fill="none" stroke="#2fd4c0" stroke-opacity="0.45" stroke-width="3"/>
  <circle cx="900" cy="230" r="16" fill="#2fd4c0"/>
  <circle cx="900" cy="230" r="30" fill="none" stroke="#2fd4c0" stroke-opacity="0.45" stroke-width="3"/>
  <text x="300" y="480" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Navsari</text>
  <text x="900" y="290" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Vapi</text>
  <text x="80" y="110" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#2fd4c0">DIYPREFAB  |  PROJECT STORY</text>
  <text x="1120" y="596" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.6">ILLUSTRATION</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
