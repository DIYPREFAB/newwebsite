  # ============================================
  # OPTION 5: Deploy to own VPS with PM2 (YOUR SETUP)
  # ============================================
  deploy-pm2:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    # If the VPS secrets are not set, SKIP the deploy instead of failing the workflow (the site may be hosted
    # elsewhere, e.g. Vercel). Once VPS_HOST, VPS_USER and VPS_SSH_KEY are added under
    # Settings > Secrets and variables > Actions, the deploy runs automatically.
    # (If they were saved as ENVIRONMENT secrets, add `environment: <name>` to this job.)
    - name: Check deployment secrets
      id: secrets
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      run: |
        missing=""
        for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
          if [ -z "${!name}" ]; then missing="$missing $name"; fi
        done
        if [ -n "$missing" ]; then
          echo "::notice title=VPS deploy skipped::Secrets not set:$missing"
          echo "ready=false" >> "$GITHUB_OUTPUT"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to VPS via SSH + PM2
      if: steps.secrets.outputs.ready == 'true'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || '22' }}
        script_stop: true
        script: |
          echo "=== Starting deployment ==="
          
          # Navigate to project directory
          cd ${{ secrets.VPS_PROJECT_PATH || '/var/www/diyprefab-website' }}
          
          # Pull latest code
          echo "Pulling latest code..."
          git pull origin main
          
          # Install dependencies
          echo "Installing dependencies..."
          npm ci
          
          # Build project with environment variables
          echo "Building project..."
          export VITE_HUBSPOT_ACCESS_TOKEN='${{ secrets.VITE_HUBSPOT_ACCESS_TOKEN }}'
          export VITE_HUBSPOT_PORTAL_ID='${{ secrets.VITE_HUBSPOT_PORTAL_ID }}'
          export VITE_LINKEDIN_PARTNER_ID='${{ secrets.VITE_LINKEDIN_PARTNER_ID }}'
          export VITE_GA_MEASUREMENT_ID='${{ secrets.VITE_GA_MEASUREMENT_ID }}'
          export VITE_CAL_NAMESPACE='${{ secrets.VITE_CAL_NAMESPACE || '45min' }}'
          npm run build
          
          # Restart PM2 process
          echo "Restarting PM2 process..."
          pm2 restart diy-frontend-react --update-env
          
          # Save PM2 config
          pm2 save
          
          echo "=== Deployment complete ==="
          
    - name: Notify deployment status
      if: steps.secrets.outputs.ready == 'true'
      run: |
        echo "Deployment status: ${{ job.status }}"